# 监听地址
host: "0.0.0.0"
port: 8317

# 认证文件存放目录（codex-*.json）
auth_dir: "./auths"

# 代理 API 的下游 key（客户端调用 /v1/* 时用）
api_keys:
  - "sk-cool-proxy-change-me"

# 管理面板的访问 token（前端登录后会带在请求头）
admin_token: "admin-change-me"

# 上游 OpenAI Codex 端点
upstream:
  base_url: "https://chatgpt.com/backend-api/codex"

# 失败处理
retry:
  max_retries: 3
  cooldown_seconds: 60          # transient/网络错误连续超阈值后的短冷却
  long_cooldown_seconds: 300    # 兼容字段，按 (账号, 模型) 二维状态机后已不再使用
  failure_threshold: 3          # 兼容字段，按 (账号, 模型) 二维状态机后已不再使用
  transient_threshold: 3        # 连续 N 次 5xx/网络错才进短冷却；默认 3
  disable_cooldown: false       # true = 所有冷却写入跳过，便于定位上游真实错误

# token 刷新
token_refresh:
  scan_interval_seconds: 60
  refresh_before_expire_seconds: 300

# 日志
log:
  level: "info"   # trace / debug / info / warn / error

# Kiro 反代：对 Claude Code 系统提示的过滤（全部可选，不写则用下面的默认值）
kiro:
  # 检测到 Claude Code 系统提示时，整体替换成精简后端提示。
  # 较激进（会丢掉 CC 自带的工具说明等），默认关；仍命中身份类 403 时再打开。
  filter_claude_code: false
  # 去掉 "--- SYSTEM PROMPT ---" 之类边界标记。安全，默认开。
  strip_boundaries: true
  # 去掉环境/身份噪音行（gitStatus / Recent commits / knowledge cutoff /
  # "you are claude code" / # Environment 段等）。默认开。
  env_noise: true
  # 合成 prompt-cache 计费：Kiro 上游不支持缓存（且按月请求数限额、不按 token 计费），
  # 此项按 Claude Code 自带的 cache_control 断点，把上游真实 input 拆成
  # cache_read / cache_creation / fresh 写入 usage，让下游（如 cool_api）像 claude
  # 渠道一样按缓存计费。只「拆分」真实总量、绝不放大，默认开。
  synth_cache: true

